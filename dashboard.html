<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل کاربری | حامی کار</title><link rel="icon" href="assets/logo.svg" type="image/svg+xml"><link rel="stylesheet" href="assets/style.css"></head><body><header class="header"><nav class="container nav"><a class="brand" href="index.html"><img class="brand-logo" src="assets/logo.svg" alt="لوگوی حامی کار"><span>حامی کار<small>پنل کاربری</small></span></a><div><button class="btn btn-outline-dark" data-logout>خروج</button></div></nav></header><main class="section"><div class="container"><div class="section-head"><span class="eyebrow">پنل مشتری</span><h1 id="welcome" style="color:var(--navy)">درخواست‌ها و پیگیری</h1><p>درخواست ثبت‌شده و وضعیت پرونده‌ها را از این صفحه پیگیری کنید.</p></div><div class="split" style="align-items:start"><section class="prose"><h2 style="color:var(--navy)">ثبت درخواست جدید</h2><form class="form" data-order-form><label>خدمت<select name="serviceId" required data-services><option value="">در حال دریافت خدمات…</option></select></label><label>شرح درخواست<textarea name="details" required minlength="10" maxlength="10000" placeholder="موضوع را بدون درج اطلاعات غیرضروری یا محرمانه شرح دهید."></textarea></label><label style="display:flex;gap:10px;align-items:flex-start"><input type="checkbox" name="acceptedTerms" required style="width:auto;margin-top:8px"><span>شرایط استفاده و سیاست حریم خصوصی را مطالعه کرده و می‌پذیرم.</span></label><button class="btn btn-gold" type="submit">ثبت درخواست</button><p role="status" aria-live="polite"></p></form><p class="note">در نسخه فعلی بارگذاری فایل، پرداخت آنلاین و تأیید پیامکی فعال نیست.</p></section><section><h2 style="color:var(--navy)">درخواست‌های من</h2><div data-orders><p>برای مشاهده درخواست‌ها وارد شوید.</p></div></section></div></div></main><script src="assets/app.js"></script></body></html>
