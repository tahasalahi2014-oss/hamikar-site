<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="ورود به پنل حامی کار"><title>ورود | حامی کار</title><link rel="icon" href="assets/logo.svg" type="image/svg+xml"><link rel="stylesheet" href="assets/style.css"></head><body><header class="header"><nav class="container nav"><a class="brand" href="index.html"><img class="brand-logo" src="assets/logo.svg" alt="لوگوی حامی کار"><span>حامی کار<small>پنل مشتریان</small></span></a><a class="btn btn-outline-dark" href="index.html">بازگشت به سایت</a></nav></header><main class="section"><div class="container" style="max-width:520px"><div class="prose"><span class="eyebrow">پنل حامی کار</span><h1 style="color:var(--navy);margin-top:4px">ورود به حساب</h1><p style="color:var(--muted)">با شماره همراه و رمز عبور وارد شوید.</p><form class="form" data-auth="login"><label>شماره همراه<input name="phone" inputmode="tel" autocomplete="tel" required minlength="8" placeholder="مثلاً 09123456789"></label><label>رمز عبور<input name="password" type="password" autocomplete="current-password" required minlength="1"></label><button class="btn btn-gold" type="submit">ورود</button><p role="status" aria-live="polite"></p></form><p>حساب ندارید؟ <a class="more" href="register.html">ثبت‌نام کنید</a></p><p class="note">این پنل به API نیاز دارد که روی سرور اجرا شود؛ صرفاً بازکردن فایل HTML، سامانه را راه‌اندازی نمی‌کند.</p></div></div></main><script src="assets/app.js"></script></body></html>
