<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="ساخت حساب مشتری حامی کار"><title>ثبت‌نام | حامی کار</title><link rel="icon" href="assets/logo.svg" type="image/svg+xml"><link rel="stylesheet" href="assets/style.css"></head><body><header class="header"><nav class="container nav"><a class="brand" href="index.html"><img class="brand-logo" src="assets/logo.svg" alt="لوگوی حامی کار"><span>حامی کار<small>ایجاد حساب مشتری</small></span></a><a class="btn btn-navy" href="login.html">ورود</a></nav></header><main class="section"><div class="container" style="max-width:560px"><div class="prose"><span class="eyebrow">شروع همکاری</span><h1 style="color:var(--navy)">ایجاد حساب مشتری</h1><form class="form" data-auth="register"><label>نام و نام خانوادگی<input name="fullName" autocomplete="name" required minlength="2" maxlength="100"></label><label>شماره همراه<input name="phone" inputmode="tel" autocomplete="tel" required minlength="8" maxlength="20" placeholder="09123456789"></label><label>رمز عبور<input name="password" type="password" autocomplete="new-password" required minlength="10" maxlength="100"><small>حداقل ۱۰ نویسه انتخاب کنید.</small></label><button class="btn btn-gold" type="submit">ساخت حساب</button><p role="status" aria-live="polite"></p></form><p class="note">ثبت‌نام با شماره همراه و رمز عبور است؛ تأیید پیامکی هنوز پیکربندی نشده است. از رمز منحصربه‌فرد استفاده کنید.</p></div></div></main><script src="assets/app.js"></script></body></html>
